<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

   <title>Frontend Mentor | Order summary card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet  -->
  <style>
     
    * { box-sizing: border-box; 
    }
       body{ font-family: Arial, sans-serif; background-color: hsl(0, 0%, 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
      .image { background: white; box-shadow: 0 1rem 1rem hsl(0, 0%, 0%, 0.2); margin-top: -300px; border-radius: 10px; }
      .image-h1 { margin-top: 50px; margin-right: 5px; }
      .image-p { color: grey; margin-left: 130px; margin-bottom: 40px; font-size: 17px; font-weight: normal; max-width: 200px; }
      .image-payment { background: hsl(0, 0%, 100%); margin-top: 0; margin-left: 0px; font-size: 20px; max-width: 500px; border-radius: 10px; padding: 0px; }
      .image-buttons { margin-left: 120px; font-size: 20px; max-width: 200px; }
      .annualplan-plan { margin-top: -50px; margin-left: -80px; color: hsl(0, 0%, 0%); }
      .annualplan-payment { margin-top: -35px; margin-left: -80px; color: hsl(0, 0%, 45%); }
      .annualplan-icon { margin-top: 20px; margin-left: 25px; }
      .annualplan-grid { display: grid; column-gap: 1000px; row-gap: 10px; background-color: hsl(229, 100%, 98%); border-radius: 10px; margin-left: 50px; margin-right: 50px; margin-bottom: 20px; }
      .annualplan-change-button { margin-top: -55px;margin-left: 250px; font-weight: bold;} 
      .annualplan-change-button a { text-decoration: none; }
      .proceed-to-payment-button {background-color: white; color: blue; box-shadow: 0, 0, 18rem hsl(0, 0%, 0%, 0.2); padding-bottom: 20px; border-radius: 10px; }
      .proceed-to-payment-button a { text-decoration: none; }
      .image-payment {background-color: white; color: white;}
      .cancel-button {background-color: transparent; color: hsl(120, 120, 120); border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 18px; font-weight: bold;}
      .cancel-button a { text-decoration: none; }
      .payment-button { background-color: rgb(49, 49, 255); color: white; border: none; font-weight: 500px; padding: 15px 90px; border-radius: 15px; cursor: pointer; font-size: 18px; }
      .payment-button a { text-decoration: none; }
      .background { display: flex; align-items: center; justify-content: center; margin-top: 100px; width: 100%; height: 100%; }
</style>
</head>
<body>
    <div class="background">
      <img src="./images/pattern-background-desktop.svg" alt="Background pattern of blue circles">
    </div>

      <div class="image">
      <img src="./images/illustration-hero.svg" alt="Illustration of a person listening to music">
      <div>
        <h1 class="image-h1">Order Summary</h1>
        <p class="image-p">You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>
        </div>
        <div class="annualplan-grid">
          <img class="annualplan-icon" src="./images/icon-music.svg" alt="Music icon"> </img>
          <p class="annualplan-plan"> <strong>Annual Plan</strong> 
          </p>
          <p class="annualplan-payment">
            $59.99/year 
          </p>

          <p class="annualplan-change-button"
            ><a href="#">Change</a>
          </p>
          </div>
          <div class="image-payment">
          <p class="proceed-to-payment-button"> 
            <button class="payment-button">Proceed to Payment</button><br><br><button class="cancel-button">Cancel Order</button>
          </p>
          </div>

      </div>

    </div>
  </div>

</body>
</html>
